name: Publish verified AIR PS3 release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag, for example v1.0.0
        required: true
        type: string
      source_sha:
        description: Full source commit SHA for the release
        required: true
        type: string
      package_sha256:
        description: Expected SHA-256 of the debug PKG asset
        required: true
        type: string

permissions: {}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag points at the selected source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$RELEASE_TAG" = "v$(python3 scripts/read-release-config.py app_version)"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SOURCE"
          git merge-base --is-ancestor "$EXPECTED_SOURCE" origin/main
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          mkdir -p build/release-assets
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          expected = {
              "ps3-airplay-receiver-1.0.0.pkg", "release-evidence.json", "SHA256SUMS.txt",
              "RELEASE_NOTES-v1.0.0.md", "INSTALLATION.md", "THIRD_PARTY_NOTICES.md",
              "MBED-TLS-3.6.7-LICENSE.txt", "PS3DK-LICENSE.txt", "PSL1GHT-LICENSE.txt",
              "PSL1GHT-RSX-LICENSE.txt",
          }
          release_ids = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases", "--paginate", "--jq",
               '.[] | select(.tag_name == env.RELEASE_TAG and .draft == true) | .id'],
              text=True,
          ).split()
          if len(release_ids) != 1:
              raise SystemExit("expected exactly one draft release for the selected tag")
          release_id = release_ids[0]
          rows = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/{release_id}/assets", "--paginate", "--jq",
               '.[] | [.id, .name, .size, .state] | @tsv'],
              text=True,
          ).splitlines()
          assets = [line.split("\t") for line in rows]
          names = [row[1] for row in assets if len(row) == 4]
          if len(names) != len(expected) or set(names) != expected:
              raise SystemExit("draft release asset set is incomplete or unexpected")
          out = pathlib.Path("build/release-assets")
          for asset_id, name, size, state in assets:
              if state != "uploaded" or pathlib.Path(name).name != name:
                  raise SystemExit("draft contains an invalid asset record")
              with (out / name).open("wb") as target:
                  subprocess.run(
                      ["gh", "api", f"repos/{repo}/releases/assets/{asset_id}",
                       "-H", "Accept: application/octet-stream"],
                      check=True, stdout=target,
                  )
              if (out / name).stat().st_size != int(size):
                  raise SystemExit(f"downloaded asset size mismatch: {name}")
          print(f"downloaded {len(names)} authenticated draft assets for {tag}")
          PY
      - name: Validate package, evidence, and hashes
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
          EXPECTED_PKG_SHA256: ${{ inputs.package_sha256 }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          pkg_count="$(find build/release-assets -maxdepth 1 -type f -name '*.pkg' | wc -l)"
          test "$pkg_count" -eq 1
          pkg="$(find build/release-assets -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$pkg"
          evidence=build/release-assets/release-evidence.json
          test -s "$evidence"
          test -s build/release-assets/INSTALLATION.md
          test -s build/release-assets/THIRD_PARTY_NOTICES.md
          test -s build/release-assets/MBED-TLS-3.6.7-LICENSE.txt
          test -s build/release-assets/PS3DK-LICENSE.txt
          test -s build/release-assets/PSL1GHT-LICENSE.txt
          test -s build/release-assets/PSL1GHT-RSX-LICENSE.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = {p.name for p in Path("build/release-assets").iterdir() if p.is_file()}
          expected = {
              "ps3-airplay-receiver-1.0.0.pkg", "release-evidence.json", "SHA256SUMS.txt",
              "RELEASE_NOTES-v1.0.0.md", "INSTALLATION.md", "THIRD_PARTY_NOTICES.md",
              "MBED-TLS-3.6.7-LICENSE.txt", "PS3DK-LICENSE.txt", "PSL1GHT-LICENSE.txt",
              "PSL1GHT-RSX-LICENSE.txt",
          }
          if actual != expected:
              raise SystemExit("unexpected release asset set")
          PY
          (cd build/release-assets && sha256sum -c SHA256SUMS.txt)
          python3 scripts/verify-release-evidence.py \
            --package "$pkg" --evidence "$evidence" \
            --expected-source "$EXPECTED_SOURCE" \
            --expected-sha256 "$EXPECTED_PKG_SHA256" \
            --release-config release.json

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: write
    steps:
      - name: Publish validated draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_id="$(gh api "repos/$GH_REPO/releases" --paginate --jq \
            '.[] | select(.tag_name == env.RELEASE_TAG and .draft == true) | .id' | head -n 1)"
          test -n "$release_id"
          test "$(gh api "repos/$GH_REPO/releases/$release_id" --jq .draft)" = "true"
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -F prerelease=false >/dev/null
