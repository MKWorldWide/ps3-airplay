# Managed security baseline; routine checks on changed commits.
name: Security Baseline

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-baseline-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect exposed credentials in changed commits
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc
        with:
          extra_args: --results=verified,unknown

  privacy:
    name: Privacy and file hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check added paths and lines without printing values
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              p = subprocess.run(["git", *args], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if p.returncode:
                  print("::error::Git inspection failed; refusing to pass.")
                  sys.exit(1)
              return p.stdout

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)
          pr = event.get("pull_request")
          head = (pr or {}).get("head", {}).get("sha") or event.get("after") or os.environ["GITHUB_SHA"]
          base = (pr or {}).get("base", {}).get("sha") or event.get("before")
          if base == ("0" * 40):
              base = None
          if base:
              args = ["diff", "--no-ext-diff", "--no-color", "--unified=0", base, head]
              files = git("diff", "--name-only", "-z", "--diff-filter=ACMR", base, head)
          else:
              args = ["show", "--format=", "--root", "--no-ext-diff", "--no-color", "--unified=0", head]
              files = git("diff-tree", "--root", "--no-commit-id", "--name-only", "-r", "-z", head)
          paths = [b.decode("utf-8", "replace") for b in files.split(b"\0") if b]
          forbidden = re.compile(
              r"(^|/)(?:\.env(?:\.(?!example$|sample$|template$)[^/]*)?|"
              r"AGENTS\.md|agents\.md|id_rsa|id_ed25519|\.DS_Store|credentials\.json)$|"
              r"\.(?:p12|pfx|pem|mobileprovision|har|key)$", re.I)
          patterns = [
              ("local home path", re.compile(r"/(?:Users|home)/[A-Za-z0-9_.-]+/")),
              ("Windows user path", re.compile(r"[A-Za-z]:\\Users\\[^\\\s]+\\", re.I)),
              ("private-network URL", re.compile(r"https?://(?:localhost|127\.0\.0\.1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+)(?::\d+)?", re.I)),
              ("MAC address", re.compile(r"\b(?:[0-9a-f]{2}:){5}[0-9a-f]{2}\b", re.I)),
              ("private key header", re.compile(r"-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----")),
          ]
          findings = []
          for path in paths:
              if forbidden.search(path):
                  findings.append(f"Restricted path: {path}")
          current = ""
          for line in git(*args).decode("utf-8", "replace").splitlines():
              if line.startswith("+++ b/"):
                  current = line[6:]
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              for label, pattern in patterns:
                  if pattern.search(line[1:]):
                      findings.append(f"{label}: {current}")
          if findings:
              for item in sorted(set(findings))[:30]:
                  print(f"::error::{item} (value withheld)")
              sys.exit(1)
          print(f"Privacy scan passed: {len(paths)} changed paths.")
          PY
